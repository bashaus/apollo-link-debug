---
name: publish

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        package:
          - handle-abort
          - handle-aws-x-ray
          - handle-errors
          - handle-request
          - handle-timer

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: install
        run: npm ci

      - name: build
        working-directory: packages/${{ matrix.package }}/
        run: npm run build

      - name: publish
        working-directory: packages/${{ matrix.package }}/
        run: npm publish --access public --provenance
